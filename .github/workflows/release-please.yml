name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Open / update Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: rust

  # ── Jobs below run only when release-please merges a Release PR and tags ────
  # They are gated on `release_created` so GITHUB_TOKEN trigger limits don't
  # apply — everything runs in the same workflow, not a separate triggered run.

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Update npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Build bundler target
        run: wasm-pack build --target bundler --out-dir npm/bundler --out-name navigo -- --features wasm

      - name: Build web target
        run: wasm-pack build --target web --out-dir npm/web --out-name navigo -- --features wasm

      - name: Remove wasm-pack scaffolding
        run: rm -f npm/bundler/{package.json,.gitignore,README.md,LICENSE} npm/web/{package.json,.gitignore,README.md,LICENSE}

      - name: Copy LICENSE
        run: cp LICENSE npm/LICENSE

      - name: Sync version with Cargo.toml
        working-directory: npm
        run: |
          VERSION=$(grep -m1 '^version' ../Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          npm pkg set version="$VERSION"

      - name: Publish
        working-directory: npm
        run: npm publish --access public

  deploy-demo:
    name: Deploy demo to Netlify
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Install demo dependencies
        working-directory: demo
        run: npm ci

      - name: Build demo (wasm-pack + vite)
        working-directory: demo
        run: npm run build

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: netlify deploy --dir=demo/dist --prod
